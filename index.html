const $=q=>document.querySelector(q),escape=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const categories={wholesale:'Wholesale / Stockist',advertising:'Advertising / Brand',retail:'Retail'};let leads=[],claimed=[],workspace={},restocks={},stockCounts=[],historicalStock=[],me=null,members=[];const api=async(path,opts={})=>{const r=await fetch('/api/'+path,{...opts,headers:{'content-type':'application/json'}});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{throw Error('Cloudflare returned an unexpected response ('+r.status+'). Check the latest deployment and Functions logs.')}if(!r.ok)throw Error(data.error+(data.detail?' '+data.detail:''));return data};

else if(page==='team'){if(me?.role!=='owner'){c.innerHTML='<h1>Team</h1><p>Owner access required.</p>';return;}c.innerHTML='<h1>Team</h1><p class="intro">Add individual caller accounts with their own PIN. Callers only see their assigned businesses.</p><section class="panel"><h2>Add caller</h2><form id="team-add" class="formgrid"><label>Caller name<input name="name" required></label><label>4–8 digit PIN<input name="pin" inputmode="numeric" pattern="[0-9]{4,8}" required></label><button class="btn primary">Add Caller</button></form><p id="team-feedback"></p></section><section class="panel"><h2>Team members</h2><div id="team-list">Loading…</div></section>';$('#team-add').onsubmit=async e=>{e.preventDefault();try{await api('team',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget).entries()))});draw()}catch(err){$('#team-feedback').textContent=err.message}};api('team').then(d=>{$('#team-list').innerHTML=d.members.map(m=>'<p>'+escape(m.name)+' · '+escape(m.role)+(m.name.toLowerCase()==='alton'&&m.role==='caller'?' <button class="btn" data-promote-alton="'+escape(m.id)+'">Grant Alton Owner Access</button>':'')+'</p>').join('')}).catch(err=>{$('#team-list').textContent=err.message});$('#team-list').onclick=async e=>{const b=e.target.closest('[data-promote-alton]');if(!b)return;if(!confirm('Grant Alton full Owner permissions, including all data and team administration?'))return;try{await api('team-role',{method:'POST',body:JSON.stringify({member_id:b.dataset.promoteAlton})});draw()}catch(err){$('#team-feedback').textContent=err.message}};}
else if(page==='catalog'){c.innerHTML='<h1>Media Kit & Pricing</h1><p class="intro">Published advertising packages and your supplied magazine prices.</p><div class="cards">'+prices.map(p=>'<div class="metric"><span>'+escape(p.type)+'</span><h2>'+escape(p.name)+'</h2>'+(p.wholesale?'<p><b>Wholesale</b> $'+p.wholesale+'<br><b>Retail</b> $'+p.retail+'</p>':'<p class="price">$'+p.price+'</p>')+'</div>').join('')+'</div><section class="panel"><h2>About PARA LLEVAR</h2><p>An annual high-end magazine exploring the people and craft behind a restaurant, with each issue in a different city.</p><p>Media kit: initial print run of 1,000 copies, long shelf life, and distribution across selected US cities, Mexico, and Europe.</p><p class="muted">Confirm inventory, current availability, shipping, and placement details before offering them to buyers.</p></section>'}
else if(page==='stock'){
 const shops=leads.filter(p=>p.category==='wholesale'&&!workspace[p.id]?.archived);
 const stats=shops.map(p=>{const history=historicalStock.find(x=>x.lead_id===p.id&&x.issue==='Issue 5');const entries=stockCounts.filter(x=>x.lead_id===p.id),qty=entries.reduce((sum,x)=>sum+x.received-x.sold-x.returned,0),check=restocks[p.id]?.next_check||'';return {p,entries,qty,check,history}});
 c.innerHTML='<h1>Stock List & Inventory</h1><p class="intro">Track confirmed counts for PARA LLEVAR Magazine and Check Please, and schedule each stockist\'s next inventory check.</p><div class="cards">'+[['Stockists',shops.length],['Recorded copies remaining',stats.reduce((n,x)=>n+x.qty,0)],['Check-ins due',stats.filter(x=>x.check&&x.check<=date()).length]].map(([k,v])=>'<div class="metric"><strong>'+v+'</strong><span>'+k+'</span></div>').join('')+'</div><section class="panel"><label>Search stockists<input id="stock-search" placeholder="Business or city"></label><div id="stock-table"></div></section>';
 if(me?.role==='owner'){const importer=document.createElement('section');importer.className='panel';importer.innerHTML='<h2>Import Original Stockist Spreadsheet</h2><p class="muted">Upload the prepared para_llevar_stockist_import.json file (not the Excel .xlsx spreadsheet). Existing businesses are skipped, and original historical order information stays in the imported client notes. Your source spreadsheet is unchanged.</p><input type="file" id="stock-import-file" accept=".json,application/json"><button class="btn primary" id="stock-import-start">Import Stockists</button><p id="stock-import-status"></p>';c.appendChild(importer);$('#stock-import-start').onclick=async()=>{const file=$('#stock-import-file').files[0],button=$('#stock-import-start');if(!file){$('#stock-import-status').textContent='First choose para_llevar_stockist_import.json (not the original Excel spreadsheet).';return}if(!file.name.toLowerCase().endsWith('.json')){$('#stock-import-status').textContent='Please select the prepared .json import file, not an .xlsx file.';return}button.disabled=true;button.textContent='Importing…';$('#stock-import-status').textContent='Reading '+file.name+'…';try{const parsed=JSON.parse(await file.text());if(parsed.format!=='para-llevar-stockists-v1'||!Array.isArray(parsed.records))throw Error('This is not a PARA LLEVAR stockist import file.');let added=0,skipped=0,counts=0;for(let i=0;i<parsed.records.length;i+=10){const part=parsed.records.slice(i,i+10);const outcome=await api('import-stockists',{method:'POST',body:JSON.stringify({records:part})});added+=outcome.added;skipped+=outcome.skipped;counts+=outcome.stockAdded||0;$('#stock-import-status').textContent='Processed '+Math.min(i+10,parsed.records.length)+' / '+parsed.records.length+' · Added '+added+' · Existing/enriched '+skipped;}await refresh();page='stock';draw();alert('Import complete: '+added+' new stockists; '+skipped+' matched or skipped; '+counts+' Issue 5 historical quantity records saved.')}catch(error){$('#stock-import-status').textContent='Import stopped: '+error.message}finally{button.disabled=false;button.textContent='Import Stockists'}};}
 const renderStock=()=>{const q=($('#stock-search').value||'').trim().toLowerCase();const found=stats.filter(x=>[x.p.business,x.p.city].join(' ').toLowerCase().includes(q));$('#stock-table').innerHTML='<div class="tablewrap"><table><thead><tr><th>Stockist</th><th>PARA LLEVAR remaining</th><th>Check Please remaining</th><th>Issue 5 received (historical)</th><th>Issue 5 remaining (historical)</th><th>Next check-in</th><th>Inventory</th></tr></thead><tbody>'+found.map(x=>{const amount=title=>{const k=x.entries.find(z=>z.title===title);return k?(k.received-k.sold-k.returned):'Not recorded'};return '<tr><td>'+escape(x.p.business)+'<div class="muted">'+escape(x.p.city||'')+'</div></td><td>'+escape(amount('PARA LLEVAR Magazine'))+'</td><td>'+escape(amount('Check Please'))+'</td><td>'+escape(x.history?.received??'—')+'</td><td>'+escape(x.history?.remaining??'—')+'</td><td>'+escape(x.check||'Not scheduled')+'</td><td><button class="btn" data-stock-open="'+escape(x.p.id)+'">Manage</button></td></tr>'}).join('')+'</tbody></table></div>';};

else if(page==='agents'){
 c.innerHTML='<h1>AI Agent Center</h1><p class="intro">Dedicated assistants for growing PARA LLEVAR. Owner approval is required before any external communication.</p><div class="cards"><section class="panel"><h2>Restock Assistant</h2><p>Checks stockists whose individual inventory check-in date is due. Saves a review queue, never contacts stores on its own.</p><button class="btn primary" id="agent-restock-run">Run Restock Check</button></section><section class="panel"><h2>Nationwide Stockist Finder</h2><p>Research city by city across the United States: bookstores, hotels, museum shops, food shops, gift shops and newsstands.</p><button class="btn" id="open-territories">Manage Territories</button> <button class="btn" data-run-agent="stockist">Review Territory Queue</button><p class="muted">Research provider not connected. Queue and verified prospects are available.</p></section><section class="panel"><h2>Grant Researcher</h2><p>Twice-daily grant research is scheduled through ChatGPT. Automatic import to this dashboard is not connected.</p><button class="btn" data-run-agent="grants">Review Grant Pipeline</button><p class="muted">External results sync not connected</p></section><section class="panel"><h2>Partnership Finder</h2><p>Track brand collaborations, editorial exchanges, hospitality partnerships, cultural events and mutual promotions.</p><button class="btn" id="open-partnerships">Partnership Pipeline</button> <button class="btn" data-run-agent="partnerships">Review Partnerships</button></section><section class="panel"><h2>Editorial Assistant</h2><p>Reviews saved Substack campaign drafts for audience and message readiness. No campaigns are sent automatically.</p><button class="btn" data-run-agent="editorial">Review Editorial Drafts</button></section></div><section class="panel"><h2>Agent Run History</h2><p id="agent-status" class="muted"></p><div id="agent-history">Loading…</div></section>';
 const territories=document.createElement('section');territories.className='panel';territories.id='territory-workspace';territories.style.display='none';territories.innerHTML='<h2>US Territory Queue</h2><p class="muted">Work through cities in manageable batches and avoid existing clients. No businesses are invented or automatically contacted.</p><form id="territory-add" class="formgrid"><label>State (2 letters)<input name="state" maxlength="2" placeholder="NY" required></label><label>City<input name="city" placeholder="Brooklyn" required></label><label>Business type<select name="category">'+['bookstores','hotels','museum shops','food shops','gift shops','newsstands'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><button class="btn primary">Add Search Territory</button></form><p id="territory-feedback" class="muted"></p><h3>Territories and Candidates</h3><div id="territory-list"></div><h3>Add a verified candidate</h3><form id="candidate-add" class="formgrid"><label>Territory<select name="territory_id" id="candidate-territory" required></select></label><label>Business name<input name="name" required></label><label>Website<input name="website" type="url" required></label><label>Source URL<input name="source_url" type="url" required></label><label>What they sell / carry<textarea name="products"></textarea></label><label>Why PARA LLEVAR fits<textarea name="fit_notes"></textarea></label><label>Storefront or product photo URL<input name="photo_url" type="url"></label><label>Contact page URL<input name="contact_url" type="url"></label><label>Verified public email<input name="contact_email" type="email"></label><label>Verified buyer name<input name="buyer_name"></label><label>Personalized pitch angle<textarea name="pitch"></textarea></label><label>Fit score<input name="fit_score" type="number" min="0" max="100" value="70"></label><button class="btn primary">Save for Review</button></form><p id="candidate-feedback" class="muted"></p>';c.appendChild(territories);
 const loadTerritories=()=>api('territories').then(d=>{if(page!=='agents')return;$('#candidate-territory').innerHTML=d.territories.map(t=>'<option value="'+escape(t.id)+'">'+escape(t.city+', '+t.state+' · '+t.category)+'</option>').join('');$('#territory-list').innerHTML=d.territories.length?d.territories.map(t=>'<div style="border-top:1px solid #ddd;padding:10px 0"><b>'+escape(t.city+', '+t.state)+'</b> · '+escape(t.category)+' · '+escape(t.status)+' <span class="muted">'+d.candidates.filter(x=>x.territory_id===t.id).length+' candidates</span><details><summary>Verified candidates</summary>'+d.candidates.filter(x=>x.territory_id===t.id).map(x=>'<div style="border:1px solid #ddd;padding:12px;margin:10px 0;display:flex;gap:14px;flex-wrap:wrap">'+(x.photo_url?'<img src="'+escape(x.photo_url)+'" alt="Store photo" loading="lazy" style="width:145px;height:105px;object-fit:cover">':'')+'<div style="flex:1;min-width:220px"><b>'+escape(x.name)+'</b> · Fit '+escape(x.fit_score||'Unscored')+'/100<p>'+escape(x.fit_notes)+'</p><p><b>Carries:</b> '+escape(x.products||'Unverified')+'</p><p><b>Contact:</b> '+escape(x.buyer_name||'Buyer unknown')+' · '+escape(x.contact_email||'Email not verified')+'</p><p><b>Approach:</b> '+escape(x.pitch||'Research needed')+'</p><a target="_blank" rel="noopener noreferrer" href="'+escape(x.website)+'">Website</a> · <a target="_blank" rel="noopener noreferrer" href="'+escape(x.source_url)+'">Source</a>'+(x.contact_url?' · <a target="_blank" rel="noopener noreferrer" href="'+escape(x.contact_url)+'">Contact page</a>':'')+'</div></div>').join('')+'</details></div>').join(''):'No territories queued yet.'}).catch(err=>{$('#territory-feedback').textContent=err.message});

if(p.category==='wholesale'){const section=document.createElement('section');section.className='panel';const getStock=title=>stockCounts.find(x=>x.lead_id===id&&x.title===title)||{};section.innerHTML='<h2>Stock Inventory</h2><p class="muted">Enter confirmed quantities for each publication. Remaining copies are calculated from received minus sold and returned.</p>'+['PARA LLEVAR Magazine','Check Please'].map((title,j)=>{const x=getStock(title);return '<fieldset style="border:1px solid #ddd;padding:12px;margin-bottom:12px"><legend>'+escape(title)+'</legend><div class="formgrid"><label>Received<input id="stock-received-'+j+'" type="number" min="0" value="'+escape(x.received??0)+'"></label><label>Sold<input id="stock-sold-'+j+'" type="number" min="0" value="'+escape(x.sold??0)+'"></label><label>Returned<input id="stock-returned-'+j+'" type="number" min="0" value="'+escape(x.returned??0)+'"></label></div><button class="btn" data-save-stock="'+j+'">Save stock count</button></fieldset>'}).join('')+'<p id="stock-feedback" class="muted"></p>';c.appendChild(section);section.onclick=async e=>{const b=e.target.closest('[data-save-stock]');if(!b)return;const j=Number(b.dataset.saveStock),title=['PARA LLEVAR Magazine','Check Please'][j];try{const values={title};for(const field of ['received','sold','returned'])values[field]=Number($('#stock-'+field+'-'+j).value);await api('stock/'+id,{method:'PATCH',body:JSON.stringify(values)});await refresh();detail(id)}catch(err){$('#stock-feedback').textContent=err.message}};}
if(p.category==='wholesale'){const policy=restocks[id]||{},panel=document.createElement('section');panel.className='panel';panel.innerHTML='<h2>Restock Check-in Schedule</h2><p class="muted">Set how many months between stock checks for this client. This schedules reminders, not automatic messages.</p><div class="formgrid"><label>Check every (months)<input id="restock-months" type="number" min="1" max="24" step="1" value="'+escape(policy.interval_months||3)+'"></label><label>Last stock check<input type="date" id="restock-last" value="'+escape(policy.last_checked||'')+'"></label></div><p><strong>Next check-in:</strong> '+escape(policy.next_check||'Not scheduled')+'</p><button class="btn primary" id="restock-save">Save Restock Schedule</button><p class="muted" id="restock-feedback"></p>';c.appendChild(panel);$('#restock-save').onclick=async()=>{try{const r=await api('restock/'+id,{method:'PATCH',body:JSON.stringify({interval_months:Number($('#restock-months').value),last_checked:$('#restock-last').value})});await refresh();detail(id);$('#restock-feedback').textContent='Saved. Next check-in: '+r.next_check}catch(e){$('#restock-feedback').textContent=e.message}};}
const editor=c.querySelector('#edit-status')?.closest('.panel .formgrid');if(editor){editor.insertAdjacentHTML('afterbegin','<label>Business name<input id="edit-business" value="'+escape(p.business)+'"></label><label>City<input id="edit-city" value="'+escape(p.city||'')+'"></label><label>Category<select id="edit-category">'+Object.entries(categories).map(([val,name])=>'<option value="'+val+'" '+(p.category===val?'selected':'')+'>'+escape(name)+'</option>').join('')+'</select></label>');}
const historyRows=historicalStock.filter(x=>x.lead_id===id);if(historyRows.length){const panel=document.createElement('section');panel.className='panel';panel.innerHTML='<h2>Historical Inventory · Spreadsheet</h2><p class="muted">Source-reported issue counts, NOT verified current stock. Review discrepancies before sending restock offers.</p><div class="tablewrap"><table><thead><tr><th>Issue</th><th>Received</th><th>Reported remaining</th><th>Source date</th></tr></thead><tbody>'+historyRows.map(x=>'<tr><td>'+escape(x.issue)+'</td><td>'+escape(x.received??'Unknown')+'</td><td>'+escape(x.remaining??'Unknown')+'</td><td>'+escape(x.source_date||'Not recorded')+'</td></tr>').join('')+'</tbody></table></div>';c.appendChild(panel);}
$('#back').onclick=()=>{selected=null;draw()};$('#save-detail').onclick=async()=>{const changes={};for(const [field,el] of [['business','edit-business'],['city','edit-city'],['category','edit-category'],['status','edit-status'],['due','edit-due'],['contact','edit-contact'],['email','edit-email'],['phone','edit-phone'],['website','edit-website'],['notes','edit-notes']])changes[field]=$('#'+el).value;try{await api('leads/'+id,{method:'PATCH',body:JSON.stringify(changes)});await refresh();detail(id)}catch(error){alert('Could not save: '+error.message)}};if(p.category==='wholesale'){$('#draft-type').value=(historicalStock.some(x=>x.lead_id===id)||stockCounts.some(x=>x.lead_id===id))?'restock':'intro'}else{$('#draft-type').querySelector('[value="restock"]').remove()}$('#draft-type').onchange=e=>{$('#draft').value=e.target.value==='restock'?restockDraft(p):draft(p,p.category)};$('#copy-draft').onclick=async()=>{try{await navigator.clipboard.writeText($('#draft').value);$('#draft-feedback').textContent='Message copied.'}catch{$('#draft').focus();$('#draft').select();$('#draft-feedback').textContent='Press Command+C or Ctrl+C to copy the selected text.'}};$('#record-send').onclick=async()=>{try{await api('leads/'+id,{method:'PATCH',body:JSON.stringify({recordSent:true,notes:(p.notes||'')+'\\n['+new Date().toLocaleString()+'] Outreach recorded manually.'})});await refresh();detail(id);$('#draft-feedback').textContent='Manual send recorded. Follow-up due in three days.'}catch(error){$('#draft-feedback').textContent=error.message}};
}
$('#nav').addEventListener('click',e=>{const button=e.target.closest('[data-page]');if(!button)return;page=button.dataset.page;selected=null;search='';draw()});
$('#content').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)detail(b.dataset.open)});
$('#add-button').onclick=()=>$('#lead-dialog').showModal();$('#close-dialog').onclick=()=>$('#lead-dialog').close();
$('#lead-form').onsubmit=async e=>{e.preventDefault();const formElement=e.currentTarget,form=Object.fromEntries(new FormData(formElement).entries()),button=formElement.querySelector('button[type="submit"],button:not([type])');if(button)button.disabled=true;try{await api('leads',{method:'POST',body:JSON.stringify(form)});formElement.reset();$('#lead-dialog').close();page='leads';await refresh()}catch(error){alert('Could not add business: '+error.message)}finally{if(button)button.disabled=false}};
async function refresh(){const [data,meta,policies,stocks,history]=await Promise.all([api('leads'),api('workspace'),api('restock'),api('stock'),api('historical-stock')]);stockCounts=stocks.stock;historicalStock=history.history;leads=data.leads;workspace=Object.fromEntries(meta.workspace.map(x=>[x.lead_id,x]));restocks=Object.fromEntries(policies.policies.map(x=>[x.lead_id,x]));claimed=me?.role==='caller'?(await api('claimed')).claimed:[];draw()}
function gate(){
 const cover=document.createElement('section');cover.id='pl-auth';cover.style.cssText='position:fixed;inset:0;z-index:999;background:#f7f6f3;display:grid;place-items:center;padding:20px';
 cover.innerHTML='<div class="panel" style="max-width:450px;width:100%"><h1>PARA LLEVAR</h1><p class="eyebrow">AI Outreach · Team access</p><p data-auth-status>Checking setup…</p><form data-auth-form class="stack hidden"><label data-account-label>Account name<input name="name" required autocomplete="username"></label><label>PIN<input name="pin" type="password" inputmode="numeric" maxlength="8" required></label><label data-setup-field class="hidden">Cloudflare setup key<input name="setupKey" type="password"></label><button class="btn primary">Continue</button></form></div>';
 document.body.appendChild(cover);return cover;
}
const overlay=gate(),authStatus=overlay.querySelector('[data-auth-status]'),authForm=overlay.querySelector('[data-auth-form]');
$('#sign-out-button').onclick=async()=>{const button=$('#sign-out-button');button.disabled=true;try{await api('logout',{method:'POST'});window.location.reload()}catch(error){alert('Unable to sign out: '+error.message);button.disabled=false}};
async function initialize(){
 try{const session=await api('me');me=session.user;overlay.remove();await refresh();return}catch{}
 try{const status=await api('setup-status');const setup=!!status.needsSetup;authStatus.textContent=setup?'Create the owner account using your Cloudflare setup key.':'Sign in with your team name and PIN.';authForm.classList.remove('hidden');authForm.querySelector('[data-setup-field]').classList.toggle('hidden',!setup);authForm.dataset.setup=String(setup);if(!setup){const accounts=await api('login-accounts');const label=authForm.querySelector('[data-account-label]');label.innerHTML='<span>Select account</span><select name="name" required data-account-select><option value="">Choose an account</option>'+accounts.accounts.map(name=>'<option value="'+escape(name)+'">'+escape(name)+'</option>').join('')+'</select>';}}
 catch(error){authStatus.textContent='Cloudflare setup required: '+error.message;}
}
authForm.onsubmit=async e=>{e.preventDefault();const b=authForm.querySelector('button'),d=Object.fromEntries(new FormData(authForm).entries());b.disabled=true;try{if(authForm.dataset.setup==='true'){await api('setup',{method:'POST',body:JSON.stringify(d)});authStatus.textContent='Owner created. Sign in with the same name and PIN.';authForm.querySelector('[data-setup-field]').classList.add('hidden');authForm.dataset.setup='false';const accounts=await api('login-accounts');authForm.querySelector('[data-account-label]').innerHTML='<span>Select account</span><select name="name" required>'+accounts.accounts.map(name=>'<option value="'+escape(name)+'">'+escape(name)+'</option>').join('')+'</select>';}else{const result=await api('login',{method:'POST',body:JSON.stringify(d)});me=result.user;overlay.remove();await refresh();}}catch(error){authStatus.textContent=error.message}finally{b.disabled=false}};
initialize();
})();
</script></body></html>
