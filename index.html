<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>PARA LLEVAR | Outreach</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#101010;background:#f7f6f3}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.side{background:#111;color:#fff;padding:26px 16px}.brand{display:flex;align-items:center;gap:12px;padding:10px 8px 28px;border-bottom:1px solid #555}.brand-mark{width:70px;height:70px;flex:none;background:white;border-radius:50%}.brand-subtitle{font:700 13px Arial,Helvetica,sans-serif;letter-spacing:1.6px;line-height:1.2;color:#fff}.side button{display:block;text-align:left;width:100%;padding:12px;border:0;background:transparent;color:#fff;border-radius:4px;margin-top:5px}.side button.active,.side button:hover{background:#fff;color:#111}.side small{display:block;color:#aaa;margin:22px 8px 5px}main{padding:28px clamp(16px,4vw,60px);max-width:1350px;width:100%}h1,h2{font-family:Georgia,'Times New Roman',serif;font-weight:400}h1{font-size:clamp(29px,4vw,49px);margin:10px 0}h2{font-size:24px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:2px;color:#555}.intro{color:#666;margin-bottom:25px}.panel{background:#fff;border:1px solid #d7d5d1;padding:22px;margin:17px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{background:#fff;border:1px solid #ddd;padding:22px}.metric strong{font:35px Georgia,serif;display:block}.metric span{color:#555;font-size:12px}.primary{background:#111!important;color:#fff!important;border:1px solid #111!important}.btn{background:white;color:#111;border:1px solid #aaa;border-radius:2px;padding:10px 14px}input,select,textarea{width:100%;border:1px solid #aaa;background:#fff;border-radius:0;padding:11px;margin-top:6px}label{font-size:13px;font-weight:600;display:block}textarea{min-height:160px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#555}td,th{padding:13px 10px;border-bottom:1px solid #ddd}td:last-child{white-space:nowrap}.pill{border:1px solid #aaa;padding:5px 9px;font-size:11px;white-space:nowrap}.muted{color:#666;font-size:13px}.hidden{display:none!important}.stack{display:grid;gap:13px}.tabrow{display:flex;gap:8px;flex-wrap:wrap}dialog{width:min(650px,95vw);border:1px solid #222;padding:25px;max-height:90vh;overflow:auto}dialog::backdrop{background:#0009}.price{font:29px Georgia,serif}.mono{font-family:monospace}.note{background:#f0efeb;padding:12px;font-size:12px}.article{border:2px solid black;padding:24px;max-width:570px;background:white}.article h3{font:italic 40px Georgia,serif}.article .rule{border-top:1px solid #111;margin:17px 0}@media(max-width:750px){.shell{display:block}.side{padding:10px}.brand{padding:10px}.side nav{display:flex;overflow-x:auto}.side button{white-space:nowrap;width:auto}.side small{display:none}main{padding:18px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand" aria-label="Para Llevar AI Outreach"><svg class="brand-mark" viewBox="0 0 240 240" role="img" aria-label="Para Llevar circular logo" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="120" r="110" fill="#fff" stroke="#111" stroke-width="2"/><text x="120" y="133" text-anchor="middle" fill="#111" font-family="Georgia,Times New Roman,serif" font-size="35" font-weight="bold" textLength="202" lengthAdjust="spacingAndGlyphs">PARA LLEVAR</text></svg><span class="brand-subtitle">AI OUTREACH</span></div><nav id="nav"><button data-page="dashboard" class="active">Dashboard</button><button data-page="leads">All Leads</button><button data-page="wholesale">Wholesale</button><button data-page="advertising">Advertising</button><button data-page="retail">Retail</button><button data-page="inbox">Inbox & Follow-ups</button><button data-page="catalog">Media Kit & Pricing</button></nav><small>EDITORIAL OUTREACH</small><button id="add-button">+ Add Business</button></aside><main><p class="eyebrow">PARA LLEVAR / BUSINESS DEVELOPMENT</p><div id="content"></div></main></div>
<dialog id="lead-dialog"><div class="flex"><h2>Add a business</h2><button class="btn" id="close-dialog">Close</button></div><form id="lead-form" class="stack"><div class="formgrid"><label>Business name *<input required name="business"></label><label>Contact person<input name="contact"></label><label>Email<input name="email" type="email"></label><label>Phone<input name="phone"></label><label>Website<input name="website"></label><label>City<input name="city"></label><label>Category<select name="category"><option value="wholesale">Wholesale / Stockist</option><option value="advertising">Advertising / Brand</option><option value="retail">Retail inquiry</option></select></label><label>Status<select name="status"><option>New</option><option>Contacted</option><option>Interested</option><option>Follow-up Due</option><option>Negotiating</option><option>Closed Won</option><option>Closed Lost</option></select></label></div><label>Notes<textarea name="notes"></textarea></label><button class="btn primary">Save Business</button></form></dialog>
<script>
(()=>{
'use strict';
const $=q=>document.querySelector(q),escape=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const prices=[{name:'PARA LLEVAR Magazine',type:'Publication',wholesale:14,retail:26},{name:'Check Please',type:'Publication',wholesale:12,retail:24},{name:'Full-page advertisement',type:'Advertising',price:800},{name:'Two full-page advertisements',type:'Advertising',price:1600},{name:'Two-page spread',type:'Advertising',price:2000},{name:'Contributor-page thank you',type:'Advertising add-on',price:200},{name:"Editor's-letter integration",type:'Advertising add-on',price:400}];
const categories={wholesale:'Wholesale / Stockist',advertising:'Advertising / Brand',retail:'Retail'};let leads=[],me=null,members=[];const api=async(path,opts={})=>{const r=await fetch('/api/'+path,{...opts,headers:{'content-type':'application/json'}});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed.');return data};
let page='dashboard',search='',selected=null;
const save=async()=>{throw Error('Use the shared database API instead of browser storage.')};
const date=()=>new Date().toISOString().slice(0,10);
const days=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const human=d=>d?new Date(d+'T12:00:00').toLocaleDateString(): 'Not set';
const leadRow=p=>'<tr><td><button class="btn" data-open="'+escape(p.id)+'">'+escape(p.business)+'</button><div class="muted">'+escape(p.city)+'</div></td><td>'+escape(categories[p.category])+'</td><td>'+escape(p.contact||p.email||p.phone||'—')+'</td><td><span class="pill">'+escape(p.status)+'</span></td><td>'+human(p.due)+'</td><td>'+escape(p.lastSent||'—')+'</td></tr>';
const table=list=>'<div class="tablewrap"><table><thead><tr><th>Business</th><th>Category</th><th>Contact</th><th>Status</th><th>Next follow-up</th><th>Last outreach</th></tr></thead><tbody>'+ (list.length?list.map(leadRow).join(''):'<tr><td colspan="6">No records yet. Add your first business.</td></tr>')+'</tbody></table></div>';
function draw(){
$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
const c=$('#content'),active=leads.filter(p=>!['Closed Won','Closed Lost'].includes(p.status));
if(page==='dashboard'){c.innerHTML='<h1>Outreach Overview</h1><p class="intro">Editorial partnerships, magazine stockists, and advertising relationships.</p><div class="cards">'+[['Total prospects',leads.length],['Wholesale',leads.filter(x=>x.category==='wholesale').length],['Advertising',leads.filter(x=>x.category==='advertising').length],['Follow-ups due',active.filter(x=>x.due&&x.due<=date()).length]].map(([k,v])=>'<div class="metric"><strong>'+v+'</strong><span>'+k+'</span></div>').join('')+'</div><section class="panel"><h2>Needs attention</h2>'+table(active.filter(x=>x.due&&x.due<=date()))+'</section>'}
else if(page==='catalog'){c.innerHTML='<h1>Media Kit & Pricing</h1><p class="intro">Published advertising packages and your supplied magazine prices.</p><div class="cards">'+prices.map(p=>'<div class="metric"><span>'+escape(p.type)+'</span><h2>'+escape(p.name)+'</h2>'+(p.wholesale?'<p><b>Wholesale</b> $'+p.wholesale+'<br><b>Retail</b> $'+p.retail+'</p>':'<p class="price">$'+p.price+'</p>')+'</div>').join('')+'</div><section class="panel"><h2>About PARA LLEVAR</h2><p>An annual high-end magazine exploring the people and craft behind a restaurant, with each issue in a different city.</p><p>Media kit: initial print run of 1,000 copies, long shelf life, and distribution across selected US cities, Mexico, and Europe.</p><p class="muted">Confirm inventory, current availability, shipping, and placement details before offering them to buyers.</p></section>'}
else if(page==='inbox'){c.innerHTML='<h1>Inbox & Follow-ups</h1><p class="intro">This initial version tracks outreach and reminders. Email account syncing and automatic sending are not yet connected.</p>'+table(leads.filter(p=>p.due&&p.due<=date()||p.status==='Interested'||p.status==='Follow-up Due'))}
else{const subset=leads.filter(p=>(page==='leads'||p.category===page)&&[p.business,p.contact,p.email,p.city].join(' ').toLowerCase().includes(search));c.innerHTML='<div class="flex"><div><h1>'+({'leads':'All Leads','wholesale':'Wholesale Stockists','advertising':'Advertising Partners','retail':'Retail Inquiries'}[page]||page)+'</h1><p class="intro">'+(page==='wholesale'?'Bookshops, boutiques, newsstands, hotels, and retailers.':page==='advertising'?'Potential sponsors and aligned hospitality brands.':'Magazine and Check Please inquiries.')+'</p></div><button class="btn primary" id="inline-add">+ Add Business</button></div><section class="panel"><label>Search businesses<input id="lead-search" placeholder="Name, email, or city" value="'+escape(search)+'"></label>'+table(subset)+'</section>';$('#inline-add').onclick=()=>$('#lead-dialog').showModal();$('#lead-search').oninput=e=>{search=e.target.value;draw()};$('#lead-search').focus({preventScroll:true});$('#lead-search').setSelectionRange(search.length,search.length);}
}
function draft(p,kind){const first=p.contact?.trim()?('Hi '+p.contact.trim()+','):'Hello,';
const base=kind==='wholesale'?'I wanted to introduce PARA LLEVAR, an independent annual magazine about the people and craft behind restaurants. We are connecting with thoughtful retailers and shops whose customers appreciate food, travel, and independent publishing. Our wholesale price is $14 per magazine, with a $26 retail price. Check Please is $12 wholesale and $24 retail. Would you be interested in discussing whether the titles might be a fit for your shelves?':kind==='advertising'?'I am reaching out from PARA LLEVAR, an independent annual magazine celebrating the people and work behind remarkable restaurants. We are looking to connect with brands that align with the dining and creative communities featured in each issue. Our current media kit lists full-page advertising from $800. Would it be useful if I shared the media kit and more information about available placements?':'I wanted to share PARA LLEVAR and Check Please. PARA LLEVAR magazines retail for $26 and Check Please for $24. If you would like details about the publications or purchasing options, I would be happy to help.';
return first+'\n\n'+base+'\n\nBest,\nPARA LLEVAR\nparallevarmag.com';}
function detail(id){const p=leads.find(x=>x.id===id);if(!p)return;selected=id;const c=$('#content');c.innerHTML='<div class="flex"><div><p class="eyebrow">'+escape(categories[p.category])+'</p><h1>'+escape(p.business)+'</h1></div><button class="btn" id="back">Back</button></div><section class="panel"><div class="formgrid"><label>Status<select id="edit-status">'+['New','Contacted','Interested','Follow-up Due','Negotiating','Closed Won','Closed Lost'].map(k=>'<option '+(p.status===k?'selected':'')+'>'+k+'</option>').join('')+'</select></label><label>Next follow-up<input type="date" id="edit-due" value="'+escape(p.due||'')+'"></label><label>Contact<input id="edit-contact" value="'+escape(p.contact||'')+'"></label><label>Email<input id="edit-email" value="'+escape(p.email||'')+'"></label><label>Phone<input id="edit-phone" value="'+escape(p.phone||'')+'"></label><label>Website<input id="edit-website" value="'+escape(p.website||'')+'"></label></div><p><label>Notes<textarea id="edit-notes">'+escape(p.notes||'')+'</textarea></label></p><button class="btn primary" id="save-detail">Save Changes</button></section><section class="panel"><h2>Outreach draft</h2><p class="muted">Editable template based on the product category. Copy it into your email; this app does not send messages yet.</p><textarea id="draft">'+escape(draft(p,p.category))+'</textarea><div class="flex"><button class="btn primary" id="copy-draft">Copy Email</button><button class="btn" id="record-send">Record Sent & Schedule 3-Day Follow-up</button></div><p class="muted" id="draft-feedback"></p></section>';
$('#back').onclick=()=>{selected=null;draw()};$('#save-detail').onclick=async()=>{const changes={};for(const [field,el] of [['status','edit-status'],['due','edit-due'],['contact','edit-contact'],['email','edit-email'],['phone','edit-phone'],['website','edit-website'],['notes','edit-notes']])changes[field]=$('#'+el).value;try{await api('leads/'+id,{method:'PATCH',body:JSON.stringify(changes)});await refresh();detail(id)}catch(error){alert('Could not save: '+error.message)}};$('#copy-draft').onclick=async()=>{try{await navigator.clipboard.writeText($('#draft').value);$('#draft-feedback').textContent='Message copied.'}catch{$('#draft').focus();$('#draft').select();$('#draft-feedback').textContent='Press Command+C or Ctrl+C to copy the selected text.'}};$('#record-send').onclick=()=>{p.lastSent=new Date().toLocaleString();p.due=days(3);p.status='Contacted';p.notes=(p.notes||'')+'\n['+p.lastSent+'] Outreach recorded manually.';save();detail(id);$('#draft-feedback').textContent='Recorded as sent. Reminder scheduled three days from today.'};
}
$('#nav').addEventListener('click',e=>{const button=e.target.closest('[data-page]');if(!button)return;page=button.dataset.page;selected=null;search='';draw()});
$('#content').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)detail(b.dataset.open)});
$('#add-button').onclick=()=>$('#lead-dialog').showModal();$('#close-dialog').onclick=()=>$('#lead-dialog').close();
$('#lead-form').onsubmit=async e=>{e.preventDefault();const form=Object.fromEntries(new FormData(e.currentTarget).entries());try{await api('leads',{method:'POST',body:JSON.stringify(form)});await refresh();$('#lead-dialog').close();e.currentTarget.reset();page='leads';draw()}catch(error){alert('Could not add business: '+error.message)}};
async function refresh(){const data=await api('leads');leads=data.leads;draw()}
function gate(){
 const cover=document.createElement('section');cover.id='pl-auth';cover.style.cssText='position:fixed;inset:0;z-index:999;background:#f7f6f3;display:grid;place-items:center;padding:20px';
 cover.innerHTML='<div class="panel" style="max-width:450px;width:100%"><h1>PARA LLEVAR</h1><p class="eyebrow">AI Outreach · Team access</p><p data-auth-status>Checking setup…</p><form data-auth-form class="stack hidden"><label>Account name<input name="name" required autocomplete="username"></label><label>PIN<input name="pin" type="password" inputmode="numeric" maxlength="8" required></label><label data-setup-field class="hidden">Cloudflare setup key<input name="setupKey" type="password"></label><button class="btn primary">Continue</button></form></div>';
 document.body.appendChild(cover);return cover;
}
const overlay=gate(),authStatus=overlay.querySelector('[data-auth-status]'),authForm=overlay.querySelector('[data-auth-form]');
async function initialize(){
 try{const session=await api('me');me=session.user;overlay.remove();await refresh();return}catch{}
 try{const status=await api('setup-status');const setup=!!status.needsSetup;authStatus.textContent=setup?'Create the owner account using your Cloudflare setup key.':'Sign in with your team name and PIN.';authForm.classList.remove('hidden');authForm.querySelector('[data-setup-field]').classList.toggle('hidden',!setup);authForm.dataset.setup=String(setup);}
 catch(error){authStatus.textContent='Cloudflare setup required: '+error.message;}
}
authForm.onsubmit=async e=>{e.preventDefault();const b=authForm.querySelector('button'),d=Object.fromEntries(new FormData(authForm).entries());b.disabled=true;try{if(authForm.dataset.setup==='true'){await api('setup',{method:'POST',body:JSON.stringify(d)});authStatus.textContent='Owner created. Sign in with the same name and PIN.';authForm.querySelector('[data-setup-field]').classList.add('hidden');authForm.dataset.setup='false';}else{const result=await api('login',{method:'POST',body:JSON.stringify(d)});me=result.user;overlay.remove();await refresh();}}catch(error){authStatus.textContent=error.message}finally{b.disabled=false}};
initialize();
})();
</script></body></html>
