te-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#555}td,th{padding:13px 10px;border-bottom:1px solid #ddd}td:last-child{white-space:nowrap}.pill{border:1px solid #aaa;padding:5px 9px;font-size:11px;white-space:nowrap}.muted{color:#666;font-size:13px}.hidden{display:none!important}.stack{display:grid;gap:13px}.tabrow{display:flex;gap:8px;flex-wrap:wrap}dialog{width:min(650px,95vw);border:1px solid #222;padding:25px;max-height:90vh;overflow:auto}dialog::backdrop{background:#0009}.price{font:29px Georgia,serif}.mono{font-family:monospace}.note{background:#f0efeb;padding:12px;font-size:12px}.article{border:2px solid black;padding:24px;max-width:570px;background:white}.article h3{font:italic 40px Georgia,serif}.article .rule{border-top:1px solid #111;margin:17px 0}@media(max-width:750px){.shell{display:block}.side{padding:10px}.brand{padding:10px}.side nav{display:flex;overflow-x:auto}.side button{white-space:nowrap;width:auto}.side small{display:none}main{padding:18px}}

</style></head><body><div class="shell"><aside class="side"><div class="brand" aria-label="Para Llevar AI Outreach"><svg class="brand-mark" viewBox="0 0 240 240" role="img" aria-label="Para Llevar circular logo" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="120" r="110" fill="#fff" stroke="#111" stroke-width="2"/><text x="120" y="133" text-anchor="middle" fill="#111" font-family="Georgia,Times New Roman,serif" font-size="35" font-weight="bold" textLength="202" lengthAdjust="spacingAndGlyphs">PARA LLEVAR</text></svg><span class="brand-subtitle">AI OUTREACH</span></div><nav id="nav"><button data-page="dashboard" class="active">Dashboard</button><button data-page="leads">All Leads</button><button data-page="wholesale">Wholesale</button><button data-page="stock">Stock List & Inventory</button><button data-page="advertising">Advertising</button><button data-page="retail">Retail</button><button data-page="inbox">Inbox & Follow-ups</button><button data-page="archive">Archive</button><button data-page="catalog">Media Kit & Pricing</button><button data-page="team">Team</button></nav><button id="sign-out-button" type="button" style="width:100%;margin:18px 0 8px;padding:12px;border:1px solid #777;background:#222;color:#fff;text-align:left;border-radius:4px">Sign Out</button><small>EDITORIAL OUTREACH</small><button id="add-button">+ Add Business</button></aside><main><p class="eyebrow">PARA LLEVAR / BUSINESS DEVELOPMENT</p><div id="content"></div></main></div>
<dialog id="lead-dialog"><div class="flex"><h2>Add a business</h2><button class="btn" id="close-dialog">Close</button></div><form id="lead-form" class="stack"><div class="formgrid"><label>Business name *<input required name="business"></label><label>Contact person<input name="contact"></label><label>Email<input name="email" type="email"></label><label>Phone<input name="phone"></label><label>Website<input name="website"></label><label>City<input name="city"></label><label>Category<select name="category"><option value="wholesale">Wholesale / Stockist</option><option value="advertising">Advertising / Brand</option><option value="retail">Retail inquiry</option></select></label><label>Status<select name="status"><option>New</option><option>Contacted</option><option>Interested</option><option>Follow-up Due</option><option>Negotiating</option><option>Closed Won</option><option>Closed Lost</option></select></label></div><label>Notes<textarea name="notes"></textarea></label><button class="btn primary">Save Business</button></form></dialog>
<script>
(()=>{
'use strict';
const $=q=>document.querySelector(q),escape=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const prices=[{name:'PARA LLEVAR Magazine',type:'Publication',wholesale:14,retail:26},{name:'Check Please',type:'Publication',wholesale:12,retail:24},{name:'Full-page advertisement',type:'Advertising',price:800},{name:'Two full-page advertisements',type:'Advertising',price:1600},{name:'Two-page spread',type:'Advertising',price:2000},{name:'Contributor-page thank you',type:'Advertising add-on',price:200},{name:"Editor's-letter integration",type:'Advertising add-on',price:400}];
const categories={wholesale:'Wholesale / Stockist',advertising:'Advertising / Brand',retail:'Retail'};let leads=[],claimed=[],workspace={},restocks={},stockCounts=[],historicalStock=[],me=null,members=[];const api=async(path,opts={})=>{const r=await fetch('/api/'+path,{...opts,headers:{'content-type':'application/json'}});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{throw Error('Cloudflare returned an unexpected response ('+r.status+'). Check the latest deployment and Functions logs.')}if(!r.ok)throw Error(data.error+(data.detail?' '+data.detail:''));return data};
let page='dashboard',search='',selected=null;
const save=async()=>{throw Error('Use the shared database API instead of browser storage.')};
const date=()=>new Date().toISOString().slice(0,10);
const days=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const human=d=>d?new Date(d+'T12:00:00').toLocaleDateString(): 'Not set';
const leadRow=p=>'<tr><td><button class="btn" data-open="'+escape(p.id)+'">'+escape(p.business)+'</button><div class="muted">'+escape(p.city)+'</div></td><td>'+escape(categories[p.category])+'</td><td>'+escape(p.contact||p.email||p.phone||'—')+'</td><td><span class="pill">'+escape(p.status)+'</span></td><td>'+human(p.due)+'</td><td>'+escape(p.lastSent||'—')+'</td></tr>';
const table=list=>'<div class="tablewrap"><table><thead><tr><th>Business</th><th>Category</th><th>Contact</th><th>Status</th><th>Next follow-up</th><th>Last outreach</th></tr></thead><tbody>'+ (list.length?list.map(leadRow).join(''):'<tr><td colspan="6">No records yet. Add your first business.</td></tr>')+'</tbody></table></div>';
function draw(){
const teamButton=$('#nav').querySelector('[data-page="team"]');if(teamButton)teamButton.hidden=me?.role!=='owner';const archiveButton=$('#nav').querySelector('[data-page="archive"]');if(archiveButton)archiveButton.hidden=me?.role!=='owner';if(page==='team'&&me?.role!=='owner')page='dashboard';
$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
const c=$('#content'),active=leads.filter(p=>!workspace[p.id]?.archived&&!['Closed Won','Closed Lost'].includes(p.status));
if(page==='dashboard'){c.innerHTML='<h1>Outreach Overview</h1><p class="intro">Editorial partnerships, magazine stockists, and advertising relationships.</p><div class="cards">'+[['Total prospects',leads.filter(x=>!workspace[x.id]?.archived).length],['Wholesale',leads.filter(x=>x.category==='wholesale'&&!workspace[x.id]?.archived).length],['Advertising',leads.filter(x=>x.category==='advertising'&&!workspace[x.id]?.archived).length],['Follow-ups due',active.filter(x=>x.due&&x.due<=date()).length]].map(([k,v])=>'<div class="metric"><strong>'+v+'</strong><span>'+k+'</span></div>').join('')+'</div><section class="panel"><h2>Needs attention</h2>'+table(active.filter(x=>x.due&&x.due<=date()))+'</section>'}
else if(page==='team'){if(me?.role!=='owner'){c.innerHTML='<h1>Team</h1><p>Owner access required.</p>';return;}c.innerHTML='<h1>Team</h1><p class="intro">Add individual caller accounts with their own PIN. Callers only see their assigned businesses.</p><section class="panel"><h2>Add caller</h2><form id="team-add" class="formgrid"><label>Caller name<input name="name" required></label><label>4–8 digit PIN<input name="pin" inputmode="numeric" pattern="[0-9]{4,8}" required></label><button class="btn primary">Add Caller</button></form><p id="team-feedback"></p></section><section class="panel"><h2>Team members</h2><div id="team-list">Loading…</div></section>';$('#team-add').onsubmit=async e=>{e.preventDefault();try{await api('team',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget).entries()))});draw()}catch(err){$('#team-feedback').textContent=err.message}};api('team').then(d=>{$('#team-list').innerHTML=d.members.map(m=>'<p>'+escape(m.name)+' · '+escape(m.role)+'</p>').join('')}).catch(err=>{$('#team-list').textContent=err.message});}
else if(page==='catalog'){c.innerHTML='<h1>Media Kit & Pricing</h1><p class="intro">Published advertising packages and your supplied magazine prices.</p><div class="cards">'+prices.map(p=>'<div class="metric"><span>'+escape(p.type)+'</span><h2>'+escape(p.name)+'</h2>'+(p.wholesale?'<p><b>Wholesale</b> $'+p.wholesale+'<br><b>Retail</b> $'+p.retail+'</p>':'<p class="price">$'+p.price+'</p>')+'</div>').join('')+'</div><section class="panel"><h2>About PARA LLEVAR</h2><p>An annual high-end magazine exploring the people and craft behind a restaurant, with each issue in a different city.</p><p>Media kit: initial print run of 1,000 copies, long shelf life, and distribution across selected US cities, Mexico, and Europe.</p><p class="muted">Confirm inventory, current availability, shipping, and placement details before offering them to buyers.</p></section>'}
else if(page==='stock'){
 const shops=leads.filter(p=>p.category==='wholesale'&&!workspace[p.id]?.archived);
 const stats=shops.map(p=>{const history=historicalStock.find(x=>x.lead_id===p.id&&x.issue==='Issue 5');const entries=stockCounts.filter(x=>x.lead_id===p.id),qty=entries.reduce((sum,x)=>sum+x.received-x.sold-x.returned,0),check=restocks[p.id]?.next_check||'';return {p,entries,qty,check,history}});
 c.innerHTML='<h1>Stock List & Inventory</h1><p class="intro">Track confirmed counts for PARA LLEVAR Magazine and Check Please, and schedule each stockist\'s next inventory check.</p><div class="cards">'+[['Stockists',shops.length],['Recorded copies remaining',stats.reduce((n,x)=>n+x.qty,0)],['Check-ins due',stats.filter(x=>x.check&&x.check<=date()).length]].map(([k,v])=>'<div class="metric"><strong>'+v+'</strong><span>'+k+'</span></div>').join('')+'</div><section class="panel"><label>Search stockists<input id="stock-search" placeholder="Business or city"></label><div id="stock-table"></div></section>';
 if(me?.role==='owner'){const importer=document.createElement('section');importer.className='panel';importer.innerHTML='<h2>Import Original Stockist Spreadsheet</h2><p class="muted">Upload the prepared para_llevar_stockist_import.json file (not the Excel .xlsx spreadsheet). Existing businesses are skipped, and original historical order information stays in the imported client notes. Your source spreadsheet is unchanged.</p><input type="file" id="stock-import-file" accept=".json,application/json"><button class="btn primary" id="stock-import-start">Import Stockists</button><p id="stock-import-status"></p>';c.appendChild(importer);$('#stock-import-start').onclick=async()=>{const file=$('#stock-import-file').files[0],button=$('#stock-import-start');if(!file){$('#stock-import-status').textContent='First choose para_llevar_stockist_import.json (not the original Excel spreadsheet).';return}if(!file.name.toLowerCase().endsWith('.json')){$('#stock-import-status').textContent='Please select the prepared .json import file, not an .xlsx file.';return}button.disabled=true;button.textContent='Importing…';$('#stock-import-status').textContent='Reading '+file.name+'…';try{const parsed=JSON.parse(await file.text());if(parsed.format!=='para-llevar-stockists-v1'||!Array.isArray(parsed.records))throw Error('This is not a PARA LLEVAR stockist import file.');let added=0,skipped=0,counts=0;for(let i=0;i<parsed.records.length;i+=10){const part=parsed.records.slice(i,i+10);const outcome=await api('import-stockists',{method:'POST',body:JSON.stringify({records:part})});added+=outcome.added;skipped+=outcome.skipped;counts+=outcome.stockAdded||0;$('#stock-import-status').textContent='Processed '+Math.min(i+10,parsed.records.length)+' / '+parsed.records.length+' · Added '+added+' · Existing/enriched '+skipped;}await refresh();page='stock';draw();alert('Import complete: '+added+' new stockists; '+skipped+' matched or skipped; '+counts+' Issue 5 historical quantity records saved.')}catch(error){$('#stock-import-status').textContent='Import stopped: '+error.message}finally{button.disabled=false;button.textContent='Import Stockists'}};}
 const renderStock=()=>{const q=($('#stock-search').value||'').trim().toLowerCase();const found=stats.filter(x=>[x.p.business,x.p.city].join(' ').toLowerCase().includes(q));$('#stock-table').innerHTML='<div class="tablewrap"><table><thead><tr><th>Stockist</th><th>PARA LLEVAR remaining</th><th>Check Please remaining</th><th>Issue 5 received (historical)</th><th>Issue 5 remaining (historical)</th><th>Next check-in</th><th>Inventory</th></tr></thead><tbody>'+found.map(x=>{const amount=title=>{const k=x.entries.find(z=>z.title===title);return k?(k.received-k.sold-k.returned):'Not recorded'};return '<tr><td>'+escape(x.p.business)+'<div class="muted">'+escape(x.p.city||'')+'</div></td><td>'+escape(amount('PARA LLEVAR Magazine'))+'</td><td>'+escape(amount('Check Please'))+'</td><td>'+escape(x.history?.received??'—')+'</td><td>'+escape(x.history?.remaining??'—')+'</td><td>'+escape(x.check||'Not scheduled')+'</td><td><button class="btn" data-stock-open="'+escape(x.p.id)+'">Manage</button></td></tr>'}).join('')+'</tbody></table></div>';};
 $('#stock-search').oninput=renderStock;renderStock();
 $('#stock-table').onclick=e=>{const b=e.target.closest('[data-stock-open]');if(b)detail(b.dataset.stockOpen)};
}
else if(page==='archive'){c.innerHTML='<h1>Archived Businesses</h1><p class="intro">Owner-only records. Open a business to restore it.</p>'+table(leads.filter(p=>workspace[p.id]?.archived));}
else if(page==='inbox'){const dueRestocks=leads.filter(p=>p.category==='wholesale'&&!workspace[p.id]?.archived&&restocks[p.id]?.next_check&&restocks[p.id].next_check<=date());c.innerHTML='<h2>Restock Check-ins Due</h2><p class="muted">Client-specific check-in dates. Confirm stock before making a restock offer.</p>'+table(dueRestocks);c.innerHTML+='<h1>Inbox & Follow-ups</h1><p class="intro">This initial version tracks outreach and reminders. Email account syncing and automatic sending are not yet connected.</p>'+table(leads.filter(p=>!workspace[p.id]?.archived&&(p.due&&p.due<=date()||p.status==='Interested'||p.status==='Follow-up Due')))}
else{const subset=leads.filter(p=>!workspace[p.id]?.archived&&(page==='leads'||p.category===page)&&[p.business,p.contact,p.email,p.city].join(' ').toLowerCase().includes(search));c.innerHTML='<div class="flex"><div><h1>'+({'leads':'All Leads','wholesale':'Wholesale Stockists','advertising':'Advertising Partners','retail':'Retail Inquiries'}[page]||page)+'</h1><p class="intro">'+(page==='wholesale'?'Bookshops, boutiques, newsstands, hotels, and retailers.':page==='advertising'?'Potential sponsors and aligned hospitality brands.':'Magazine and Check Please inquiries.')+'</p></div><button class="btn primary" id="inline-add">+ Add Business</button></div><section class="panel"><label>Search businesses<input id="lead-search" placeholder="Name, email, or city" value="'+escape(search)+'"></label>'+table(subset)+'</section>';if(me?.role==='caller'&&page==='leads'&&claimed.length){const locked=document.createElement('section');locked.className='panel';locked.innerHTML='<h2>Assigned to another caller</h2><p class="muted">These businesses are unavailable and excluded from your lead search. Contact the Owner if you need one reassigned.</p><div class="tablewrap"><table><thead><tr><th>Business</th><th>City</th><th>Access</th></tr></thead><tbody>'+claimed.map(p=>'<tr style="opacity:.45;pointer-events:none"><td>'+escape(p.business)+'</td><td>'+escape(p.city||'—')+'</td><td>Locked</td></tr>').join('')+'</tbody></table></div>';c.appendChild(locked);} $('#inline-add').onclick=()=>$('#lead-dialog').showModal();$('#lead-search').oninput=e=>{search=e.target.value;draw()};$('#lead-search').focus({preventScroll:true});$('#lead-search').setSelectionRange(search.length,search.length);}
}
function restockDraft(p){const first=p.contact?.trim()?('Hi '+p.contact.trim()+','):'Hello,';return first+'\n\nI hope you’re doing well. I wanted to check in and see how your PARA LLEVAR and Check Please stock is looking.\n\nDo you have enough copies on hand, or would you like us to arrange a restock? Happy to help with whatever you need.\n\nBest,\nPARA LLEVAR\nparallevarmag.com';}
function draft(p,kind){const first=p.contact?.trim()?('Hi '+p.contact.trim()+','):'Hello,';
const base=kind==='wholesale'?'I wanted to introduce PARA LLEVAR, an independent annual magazine about the people and craft behind restaurants. We are connecting with thoughtful retailers and shops whose customers appreciate food, travel, and independent publishing. Our wholesale price is $14 per magazine, with a $26 retail price. Check Please is $12 wholesale and $24 retail. Would you be interested in discussing whether the titles might be a fit for your shelves?':kind==='advertising'?'I am reaching out from PARA LLEVAR, an independent annual magazine celebrating the people and work behind remarkable restaurants. We are looking to connect with brands that align with the dining and creative communities featured in each issue. Our current media kit lists full-page advertising from $800. Would it be useful if I shared the media kit and more information about available placements?':'I wanted to share PARA LLEVAR and Check Please. PARA LLEVAR magazines retail for $26 and Check Please for $24. If you would like details about the publications or purchasing options, I would be happy to help.';
return first+'\n\n'+base+'\n\nBest,\nPARA LLEVAR\nparallevarmag.com';}
function detail(id){const p=leads.find(x=>x.id===id);if(!p)return;selected=id;const c=$('#content');c.innerHTML='<div class="flex"><div><p class="eyebrow">'+escape(categories[p.category])+'</p><h1>'+escape(p.business)+'</h1></div><button class="btn" id="back">Back</button></div><section class="panel"><div class="formgrid"><label>Status<select id="edit-status">'+['New','Contacted','Interested','Follow-up Due','Negotiating','Closed Won','Closed Lost'].map(k=>'<option '+(p.status===k?'selected':'')+'>'+k+'</option>').join('')+'</select></label><label>Next follow-up<input type="date" id="edit-due" value="'+escape(p.due||'')+'"></label><label>Contact<input id="edit-contact" value="'+escape(p.contact||'')+'"></label><label>Email<input id="edit-email" value="'+escape(p.email||'')+'"></label><label>Phone<input id="edit-phone" value="'+escape(p.phone||'')+'"></label><label>Website<input id="edit-website" value="'+escape(p.website||'')+'"></label></div><p><label>Notes<textarea id="edit-notes">'+escape(p.notes||'')+'</textarea></label></p><button class="btn primary" id="save-detail">Save Changes</button></section><section class="panel"><h2>Email draft</h2><p class="muted">Choose a message type. Edit before copying; this app does not send messages yet.</p><label>Message type<select id="draft-type"><option value="intro">New partnership introduction</option><option value="restock">Existing stockist restock check-in</option></select></label><textarea id="draft">'+escape(p.category==='wholesale'&&(historicalStock.some(x=>x.lead_id===id)||stockCounts.some(x=>x.lead_id===id))?restockDraft(p):draft(p,p.category))+'</textarea><div class="flex"><button class="btn primary" id="copy-draft">Copy Email</button><button class="btn" id="record-send">Record Sent & Schedule 3-Day Follow-up</button></div><p class="muted" id="draft-feedback"></p></section>';
const w=workspace[id]||{};const box=document.createElement('section');box.className='panel';box.innerHTML='<h2>Client Workspace</h2><p class="muted">Research, opportunity analysis, lead quality, outreach channel and saved messaging. Visible only to this caller and Owner.</p><div class="formgrid"><label>Lead score (1–100)<input id="workspace-score" type="number" min="1" max="100" value="'+escape(w.score??50)+'"></label><label>Preferred channel<select id="workspace-channel">'+['email','dm','phone'].map(x=>'<option '+((w.channel||'email')===x?'selected':'')+' value="'+x+'">'+x.toUpperCase()+'</option>').join('')+'</select></label></div><label>Research & sources<textarea id="workspace-research" placeholder="Business, products, website, social accounts, evidence and date">'+escape(w.research||'')+'</textarea></label><label>Opportunity analysis<textarea id="workspace-opportunity" placeholder="Why PARA LLEVAR is relevant; what to offer">'+escape(w.opportunity||'')+'</textarea></label><label>Saved outreach message<textarea id="workspace-draft" placeholder="Save a personalized message for reuse">'+escape(w.draft||'')+'</textarea></label><div class="flex"><button class="btn primary" id="workspace-save">Save Workspace</button>'+(me?.role==='owner'?'<button class="btn" id="workspace-archive">'+(w.archived?'Restore business':'Archive business')+'</button>':'')+'</div><p id="workspace-feedback" class="muted"></p><h3>Activity History</h3><div id="workspace-activity">Loading activity…</div>';c.appendChild(box);
if(me?.role==='owner'){const transfer=document.createElement('section');transfer.className='panel';transfer.innerHTML='<h2>Lead Ownership</h2><p>Assign one caller to this business. Existing records and activity remain intact.</p><div class="flex"><select id="owner-assignee"><option value="">Loading team…</option></select><button class="btn primary" id="owner-transfer">Reassign</button></div><p id="owner-feedback"></p>';c.appendChild(transfer);api('team').then(data=>{const selector=$('#owner-assignee');selector.innerHTML=data.members.filter(m=>m.active).map(m=>'<option value="'+escape(m.id)+'" '+(p.assigned_to===m.id?'selected':'')+'>'+escape(m.name)+' ('+escape(m.role)+')</option>').join('')});$('#owner-transfer').onclick=async()=>{try{await api('leads/'+id,{method:'PATCH',body:JSON.stringify({assigned_to:$('#owner-assignee').value})});await refresh();detail(id);$('#owner-feedback').textContent='Reassigned.'}catch(e){$('#owner-feedback').textContent=e.message}}}
const loadActivity=()=>api('activity?leadId='+encodeURIComponent(id)).then(d=>{$('#workspace-activity').innerHTML=d.activity.length?d.activity.map(a=>'<p>'+escape(a.action.replaceAll('_',' '))+' · '+escape(a.actor||'Unknown')+' · '+escape(a.created_at)+'</p>').join(''):'No activity yet.'}).catch(e=>{$('#workspace-activity').textContent=e.message});loadActivity();
$('#workspace-save').onclick=async()=>{try{await api('workspace/'+id,{method:'PATCH',body:JSON.stringify({score:$('#workspace-score').value,channel:$('#workspace-channel').value,research:$('#workspace-research').value,opportunity:$('#workspace-opportunity').value,draft:$('#workspace-draft').value})});await refresh();detail(id);$('#workspace-feedback').textContent='Workspace saved.'}catch(e){$('#workspace-feedback').textContent=e.message}};
if(me?.role==='owner')$('#workspace-archive').onclick=async()=>{try{await api('workspace/'+id,{method:'PATCH',body:JSON.stringify({archived:!w.archived})});await refresh();detail(id)}catch(e){$('#workspace-feedback').textContent=e.message}};
if(p.category==='wholesale'){const section=document.createElement('section');section.className='panel';const getStock=title=>stockCounts.find(x=>x.lead_id===id&&x.title===title)||{};section.innerHTML='<h2>Stock Inventory</h2><p class="muted">Enter confirmed quantities for each publication. Remaining copies are calculated from received minus sold and returned.</p>'+['PARA LLEVAR Magazine','Check Please'].map((title,j)=>{const x=getStock(title);return '<fieldset style="border:1px solid #ddd;padding:12px;margin-bottom:12px"><legend>'+escape(title)+'</legend><div class="formgrid"><label>Received<input id="stock-received-'+j+'" type="number" min="0" value="'+escape(x.received??0)+'"></label><label>Sold<input id="stock-sold-'+j+'" type="number" min="0" value="'+escape(x.sold??0)+'"></label><label>Returned<input id="stock-returned-'+j+'" type="number" min="0" value="'+escape(x.returned??0)+'"></label></div><button class="btn" data-save-stock="'+j+'">Save stock count</button></fieldset>'}).join('')+'<p id="stock-feedback" class="muted"></p>';c.appendChild(section);section.onclick=async e=>{const b=e.target.closest('[data-save-stock]');if(!b)return;const j=Number(b.dataset.saveStock),title=['PARA LLEVAR Magazine','Check Please'][j];try{const values={title};for(const field of ['received','sold','returned'])values[field]=Number($('#stock-'+field+'-'+j).value);await api('stock/'+id,{method:'PATCH',body:JSON.stringify(values)});await refresh();detail(id)}catch(err){$('#stock-feedback').textContent=err.message}};}
if(p.category==='wholesale'){const policy=restocks[id]||{},panel=document.createElement('section');panel.className='panel';panel.innerHTML='<h2>Restock Check-in Schedule</h2><p class="muted">Set how many months between stock checks for this client. This schedules reminders, not automatic messages.</p><div class="formgrid"><label>Check every (months)<input id="restock-months" type="number" min="1" max="24" step="1" value="'+escape(policy.interval_months||3)+'"></label><label>Last stock check<input type="date" id="restock-last" value="'+escape(policy.last_checked||'')+'"></label></div><p><strong>Next check-in:</strong> '+escape(policy.next_check||'Not scheduled')+'</p><button class="btn primary" id="restock-save">Save Restock Schedule</button><p class="muted" id="restock-feedback"></p>';c.appendChild(panel);$('#restock-save').onclick=async()=>{try{const r=await api('restock/'+id,{method:'PATCH',body:JSON.stringify({interval_months:Number($('#restock-months').value),last_checked:$('#restock-last').value})});await refresh();detail(id);$('#restock-feedback').textContent='Saved. Next check-in: '+r.next_check}catch(e){$('#restock-feedback').textContent=e.message}};}
const editor=c.querySelector('#edit-status')?.closest('.panel .formgrid');if(editor){editor.insertAdjacentHTML('afterbegin','<label>Business name<input id="edit-business" value="'+escape(p.business)+'"></label><label>City<input id="edit-city" value="'+escape(p.city||'')+'"></label><label>Category<select id="edit-category">'+Object.entries(categories).map(([val,name])=>'<option value="'+val+'" '+(p.category===val?'selected':'')+'>'+escape(name)+'</option>').join('')+'</select></label>');}
const historyRows=historicalStock.filter(x=>x.lead_id===id);if(historyRows.length){const panel=document.createElement('section');panel.className='panel';panel.innerHTML='<h2>Historical Inventory · Spreadsheet</h2><p class="muted">Source-reported issue counts, NOT verified current stock. Review discrepancies before sending restock offers.</p><div class="tablewrap"><table><thead><tr><th>Issue</th><th>Received</th><th>Reported remaining</th><th>Source date</th></tr></thead><tbody>'+historyRows.map(x=>'<tr><td>'+escape(x.issue)+'</td><td>'+escape(x.received??'Unknown')+'</td><td>'+escape(x.remaining??'Unknown')+'</td><td>'+escape(x.source_date||'Not recorded')+'</td></tr>').join('')+'</tbody></table></div>';c.appendChild(panel);}
$('#back').onclick=()=>{selected=null;draw()};$('#save-detail').onclick=async()=>{const changes={};for(const [field,el] of [['business','edit-business'],['city','edit-city'],['category','edit-category'],['status','edit-status'],['due','edit-due'],['contact','edit-contact'],['email','edit-email'],['phone','edit-phone'],['website','edit-website'],['notes','edit-notes']])changes[field]=$('#'+el).value;try{await api('leads/'+id,{method:'PATCH',body:JSON.stringify(changes)});await refresh();detail(id)}catch(error){alert('Could not save: '+error.message)}};if(p.category==='wholesale'){$('#draft-type').value=(historicalStock.some(x=>x.lead_id===id)||stockCounts.some(x=>x.lead_id===id))?'restock':'intro'}else{$('#draft-type').querySelector('[value="restock"]').remove()}$('#draft-type').onchange=e=>{$('#draft').value=e.target.value==='restock'?restockDraft(p):draft(p,p.category)};$('#copy-draft').onclick=async()=>{try{await navigator.clipboard.writeText($('#draft').value);$('#draft-feedback').textContent='Message copied.'}catch{$('#draft').focus();$('#draft').select();$('#draft-feedback').textContent='Press Command+C or Ctrl+C to copy the selected text.'}};$('#record-send').onclick=async()=>{try{await api('leads/'+id,{method:'PATCH',body:JSON.stringify({recordSent:true,notes:(p.notes||'')+'\\n['+new Date().toLocaleString()+'] Outreach recorded manually.'})});await refresh();detail(id);$('#draft-feedback').textContent='Manual send recorded. Follow-up due in three days.'}catch(error){$('#draft-feedback').textContent=error.message}};
}
$('#nav').addEventListener('click',e=>{const button=e.target.closest('[data-page]');if(!button)return;page=button.dataset.page;selected=null;search='';draw()});
$('#content').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)detail(b.dataset.open)});
$('#add-button').onclick=()=>$('#lead-dialog').showModal();$('#close-dialog').onclick=()=>$('#lead-dialog').close();
$('#lead-form').onsubmit=async e=>{e.preventDefault();const formElement=e.currentTarget,form=Object.fromEntries(new FormData(formElement).entries()),button=formElement.querySelector('button[type="submit"],button:not([type])');if(button)button.disabled=true;try{await api('leads',{method:'POST',body:JSON.stringify(form)});formElement.reset();$('#lead-dialog').close();page='leads';await refresh()}catch(error){alert('Could not add business: '+error.message)}finally{if(button)button.disabled=false}};
async function refresh(){const [data,meta,policies,stocks,history]=await Promise.all([api('leads'),api('workspace'),api('restock'),api('stock'),api('historical-stock')]);stockCounts=stocks.stock;historicalStock=history.history;leads=data.leads;workspace=Object.fromEntries(meta.workspace.map(x=>[x.lead_id,x]));restocks=Object.fromEntries(policies.policies.map(x=>[x.lead_id,x]));claimed=me?.role==='caller'?(await api('claimed')).claimed:[];draw()}
function gate(){
 const cover=document.createElement('section');cover.id='pl-auth';cover.style.cssText='position:fixed;inset:0;z-index:999;background:#f7f6f3;display:grid;place-items:center;padding:20px';
 cover.innerHTML='<div class="panel" style="max-width:450px;width:100%"><h1>PARA LLEVAR</h1><p class="eyebrow">AI Outreach · Team access</p><p data-auth-status>Checking setup…</p><form data-auth-form class="stack hidden"><label data-account-label>Account name<input name="name" required autocomplete="username"></label><label>PIN<input name="pin" type="password" inputmode="numeric" maxlength="8" required></label><label data-setup-field class="hidden">Cloudflare setup key<input name="setupKey" type="password"></label><button class="btn primary">Continue</button></form></div>';
 document.body.appendChild(cover);return cover;
}
const overlay=gate(),authStatus=overlay.querySelector('[data-auth-status]'),authForm=overlay.querySelector('[data-auth-form]');
$('#sign-out-button').onclick=async()=>{const button=$('#sign-out-button');button.disabled=true;try{await api('logout',{method:'POST'});window.location.reload()}catch(error){alert('Unable to sign out: '+error.message);button.disabled=false}};
async function initialize(){
 try{const session=await api('me');me=session.user;overlay.remove();await refresh();return}catch{}
 try{const status=await api('setup-status');const setup=!!status.needsSetup;authStatus.textContent=setup?'Create the owner account using your Cloudflare setup key.':'Sign in with your team name and PIN.';authForm.classList.remove('hidden');authForm.querySelector('[data-setup-field]').classList.toggle('hidden',!setup);authForm.dataset.setup=String(setup);if(!setup){const accounts=await api('login-accounts');const label=authForm.querySelector('[data-account-label]');label.innerHTML='<span>Select account</span><select name="name" required data-account-select><option value="">Choose an account</option>'+accounts.accounts.map(name=>'<option value="'+escape(name)+'">'+escape(name)+'</option>').join('')+'</select>';}}
 catch(error){authStatus.textContent='Cloudflare setup required: '+error.message;}
}
authForm.onsubmit=async e=>{e.preventDefault();const b=authForm.querySelector('button'),d=Object.fromEntries(new FormData(authForm).entries());b.disabled=true;try{if(authForm.dataset.setup==='true'){await api('setup',{method:'POST',body:JSON.stringify(d)});authStatus.textContent='Owner created. Sign in with the same name and PIN.';authForm.querySelector('[data-setup-field]').classList.add('hidden');authForm.dataset.setup='false';const accounts=await api('login-accounts');authForm.querySelector('[data-account-label]').innerHTML='<span>Select account</span><select name="name" required>'+accounts.accounts.map(name=>'<option value="'+escape(name)+'">'+escape(name)+'</option>').join('')+'</select>';}else{const result=await api('login',{method:'POST',body:JSON.stringify(d)});me=result.user;overlay.remove();await refresh();}}catch(error){authStatus.textContent=error.message}finally{b.disabled=false}};
initialize();
})();
</script></body></html>
